<!DOCTYPE html>

<html>

        <header>

                        <input type="text" maxlength="1" size="1" pattern="[A-Za-z]" id="char3" name="input">

                        <input type="text" maxlength="1" size="1" pattern="[A-Za-z]" id="char5" name="input">
                    
                        <select id="color1" name="color">
                          <option value="grey">Grey</option>
                          <option value="yellow">Yellow</option>
                          <option value="green">Green</option>
                        </select>

                        <select id="color2" name="color">
                            <option value="grey">Grey</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                          </select>

                        <select id="color3" name="color">
                            <option value="grey">Grey</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                        </select>

                        <select id="color4" name="color">
                            <option value="grey">Grey</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                        </select>

                        <select id="color5" name="color">
                            <option value="grey">Grey</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                        </select>
                    </div><br>

                    <button type="button" id="submitButton">Submit</button>
                    
                    <div id="responseField">

                    </div>
                    
                    
                </form>
            </div>
        </main>
        <footer>
        </footer>

</html>
